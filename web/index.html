<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced by Header once the run's market is known; this is only what shows while
         the bundle boots, so it names no market rather than naming the wrong one. -->
    <title>Plott &amp; Sunder 1982</title>
    <script>
      // Match the OS theme before first paint so the page never flashes the wrong one.
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
