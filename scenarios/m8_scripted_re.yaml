# Engine correctness gate for MARKET 8, an equal-width control. Zero API cost.
# Rational-expectations baseline: prices MUST reach 400 in X periods and 200 in
# Y periods, with certificates in the RE-predicted hands (type III on X, type II on Y).
# Both targets are exactly 100 francs from the uninformed 300, and a competitive price
# occupies the same 0.200 of D on each side. If the engine cannot hit them symmetrically
# with agents that already know the answer, an asymmetry measured on LLM agents is the
# engine's and not the market's.
#
# Run on the seed-42 draw — the market m8_ctrl_42 actually faces — rather than on the
# inherited `paper_exact` sequence. A gate that passes on a sequence nothing runs is a
# gate on the wrong market.
run_name: m8_scripted_re
seed: 42
sequence_preset: random_prior
market: 8
sessions: 1
max_rounds_per_period: 3

rules:
  price_improvement: true          # baseline; see market3_no_improvement.yaml
  announce_no_info_period: false   # market 4's design, which this inherits
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0             # whole period, like market 5's photocopied log
  period_end_notes: 2
  trade_notes: 3
  not_selected_window: 5
agents:
  - kind: re
