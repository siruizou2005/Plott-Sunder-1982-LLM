# Two-period vendor shakedown: deepseek-v4-flash through Bailian's OpenAI-compatible
# endpoint. Same weights as DeepSeek's own API, so a difference in outcome is a difference
# in serving, not in configuration. Verified: Bailian honours DeepSeek's
# extra_body={"thinking": {...}} toggle and returns reasoning_content.
#
#   year 1: no information, state X -> both models say 220
#   year 2: six insiders, state Y   -> RE 175 vs PI 220, the separating cell
run_name: probe_bailian
seed: 20250725
sequence_preset: probe_none_then_insider
sessions: 1
periods: 2
max_rounds_per_period: 3

rules:
  price_improvement: true
  announce_no_info_period: false
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0
  period_end_notes: 2
  trade_notes: 3
  not_selected_window: 5

agents:
  - kind: llm
    model: deepseek-v4-flash
    base_url: $DASHSCOPE_BASE_URL      # the whole vendor switch
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.7
    thinking: true
    broadcast_thinking: true
    reflect_thinking: true
    max_output_tokens: 8192
    broadcast_max_output_tokens: 512
    reflect_max_output_tokens: 3000

# Bailian, 华北2: CNY 1 / 2 per million in and out (output includes the chain of thought);
# cached input bills at 20% of input. Converted at CNY 7.1 = USD 1 — a hand-entered
# assumption, not a fetched rate.
pricing:
  input_per_mtok: 0.1408
  cached_input_per_mtok: 0.0282
  output_per_mtok: 0.2817
