# Market 7, tier 3 of the disclosure ladder. Identical to m7_ctrl_42
# -- same market, same seed, same drawn sequence, same model, same three thinking
# budgets, same W=12 -- except for the rules flagged below. The ladder is
# docs/disclosure-treatment.md; this file is market 7's seed-42 rung 3 of it.
#
# Market 7 is where the free-rider identity bites and where tier 1 went BACKWARDS:
# -0.070 on the buy side and -0.310 on the sell side against its baseline. The reading in
# docs/disclosure-results.md is that disclosure deleted an ambiguity that had been doing
# useful work. A baseline agent watching the price climb to 340 has two explanations and
# cannot separate them -- someone holds a letter, or someone simply values it more -- and
# BOTH point at following the price. Told the three tables, it learns 260 is the highest
# uninformed value, stops reading 340 as "someone values it more", and needs one further
# step to read it at all: a price above every uninformed valuation can only mean someone
# is informed. Market 7's agents did not take it. They stopped at "260 is the ceiling, I
# will not chase" -- their drift from their own arithmetic fell from 95 francs to 36 and
# went flat within the period, types I and II landing within 5 francs of it.
#
# Tier 3 adds ONE sentence to its tier-2 twin: the investors holding the cards are the
# same ones in every year cards are handed out. This is the ladder's only single-dial
# contrast -- the tier-2 file is identical but for disclose_insiders_fixed -- and it is
# true of the engine rather than asserted: Market.insiders is the first two seats of each
# type block and neither the period nor the redraw moves it, which
# tests/test_prompts.py::test_fixedness_disclosure_matches_the_engine pins.
#
# What it does NOT disclose, here or at any rung, is WHICH investors they are.
#
# Everything else is its tier-2 twin's, including objective_profit_max, clue_is_certain
# and the memo-style year-end summary, so the pair differs in the fixedness sentence alone.
# That is what keeps this contrast clean while tier 2 minus tier 1 is a bundle of four.
#
# Run on m7_ctrl_42's seed: Market.redrawn keys the sequence RNG on
# "ps1982-m7-seq-42", so this session draws the same fourteen states its pairs drew
# (XXXXYXYXYYXXXX), and the comparison is PAIRED period by period against
# runs/control/m7_ctrl_42 and runs/disclosed/m7_disc_42.
#
# The nine informed periods split 5 buy / 4 sell on this draw. The two seeds this
# market runs were chosen so that they pool to 9 buy / 9 sell, which is a departure from
# scenarios/m7_control.yaml's refusal to filter seeds on the buy/sell balance -- and is
# defensible for the reason that refusal does not cover. That refusal is about a reported
# LEVEL, where a selected sample biases the estimate. This is a paired within-market
# contrast: the same drawn sequence appears on both sides of every comparison, so the
# state balance moves the precision of the paired difference and not its expectation. It
# is blocking on a pre-treatment covariate, not sample selection. The full four-rung
# ladder exists on this seed.
run_name: ladder3/m7_lad3_42
seed: 42
sequence_preset: random_prior
market: 7
sessions: 1
max_rounds_per_period: 3
# This wave is four sessions x 12 workers = 48 in flight, inside Bailian's tolerated
# 50-80. The two ladder waves run SEPARATELY: all eight at once would be 96, past it.
broadcast_workers: 12

rules:
  price_improvement: true          # baseline; see market3_no_improvement.yaml
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0             # whole period, like market 5's photocopied log
  trade_notes: 3
  not_selected_window: 5
  # The rung. pydantic drops unknown keys silently, so a typo here would run a LOWER rung
  # under this run_name -- tests/test_scenarios.py asserts every flag actually loads from
  # this file, AND that the ones this rung does not set are still off, which is the only
  # thing separating this file from its twin at the other tier.
  disclose_structure: true         # tier 1, unchanged
  disclose_card_years: true        # tier 2: both directions, every year
  disclose_insiders_fixed: true    # tier 3: and the holders do not change
  objective_profit_max: true       # rides with tiers 2 and 3; see above
  clue_is_certain: true            # rides with tiers 2 and 3; states no new fact
  # announce_no_info_period is left UNSET on purpose: disclose_card_years announces the
  # same fact in the no-card direction, and Config refuses an explicit false beside it.
  #
  # The year-end summary runs as a MEMO rather than a fresh 100-word note: one standing
  # document, rewritten in full each year, the new version replacing the old. The baseline
  # note is honoured tightly (median 105 words), so fourteen years leave fourteen
  # disconnected notes behind a window of two and nothing carries a view forward. Config
  # forces the window to 1 -- a memo already contains its own history -- and refuses a
  # reflect budget under 4096, which is why the agent block below raises it.
  #
  # This is held CONSTANT across tiers 2 and 3, so tier3 - tier2 is still the single-dial
  # fixedness contrast. It does mean tier2 - tier1 moves four things at once against the
  # completed runs/disclosed/ sessions, not three; docs/disclosure-treatment.md says so.
  period_end_style: memo
  period_end_notes: 1              # forced by Config: the memo supersedes its own history
agents:
  - kind: llm
    model: deepseek-v4-flash
    base_url: $DASHSCOPE_BASE_URL      # Bailian; same weights, ~half the price
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.7
    thinking: true                 # turn decisions reason
    broadcast_thinking: true       # measured: with thinking off, 67% of broadcast
                                   # replies cited the wrong expected value; see
                                   # scenarios/market3_broadcast_fast.yaml
    max_output_tokens: 8192        # reasoning and the JSON share this budget; at 2048,
                                   # 12% of turn calls truncated mid-string
    broadcast_max_output_tokens: 8192  # 512 truncated 29% of broadcasts to nothing;
                                       # see scenarios/m7_control_r6_s42.yaml
    reflect_thinking: true          # notes reason too; see docs/design-deltas.md 5.2
    reflect_max_output_tokens: 8192 # the memo is ~1,100 tokens of body and
                                   # reasoning shares the budget; at 3000
                                   # (the note default) it would truncate
                                   # mid-sentence and be stored anyway

pricing:
  input_per_mtok: 0.1408
  cached_input_per_mtok: 0.0282
  output_per_mtok: 0.2817
