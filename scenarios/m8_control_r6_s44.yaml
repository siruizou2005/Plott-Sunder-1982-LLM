# Market 8 control, SIX rounds per period. Identical to scenarios/m8_control.yaml in every other
# respect -- same market, same seed, same model, same three thinking budgets, same W=12,
# same rules -- because this arm asks one question and must vary one thing to ask it.
#
# The question is truncation. In the reported three-round control sessions the price is
# still moving when the period ends: on informed-SELLING periods discovery rises 0.29
# between the penultimate and the final round (n=19, p=0.0004), and on buying periods 0.06
# (p=0.084). The headline control result -- that the two sides agree at D = 0.41 and 0.40
# -- may therefore be two unfinished paths measured at the same arbitrary moment rather
# than two markets that have settled in the same place.
#
# Run on the seed its three-round counterpart used, so every session here faces a market
# identical to one already reported, down to the drawn sequence. That makes the comparison
# PAIRED period by period: across the six sessions of this arm the paired test has power
# 0.65 to detect the final-round climb halving. If instead D keeps climbing into rounds
# 4-6 and arrives near 1.0, no test is needed -- the reported result is truncation and the
# control markets' section must be rewritten.
#
# Market 4's rounds arm (scenarios/m4_paper_r6.yaml) already ran this comparison in the
# PUBLISHED family and found the informed buyer's failure was not a rounds artefact. That
# does not carry over: market 4's buy side is 165 francs from its target and market 7's is
# 100, on a different prior, and the sell sides differ by more.
run_name: control/m8_ctrl_r6_44
seed: 44
sequence_preset: random_prior
market: 8
sessions: 1
max_rounds_per_period: 6
# This arm's six sessions x 12 workers = 72 in flight, a structural ceiling against
# Bailian's tolerated 50-80; the measured mean is 1.9 per session, so ~11 typical. W stays
# at 12 because the 26 sessions of the main result all ran at 12 and this arm is read
# against them. See bailian_paper.yaml. The arm therefore has to run ALONE -- launching it
# beside the other two proposed arms would put 13 sessions and 156 requests against that
# ceiling. run_proposed.sh runs the three arms as separate waves for this reason.
broadcast_workers: 12

rules:
  price_improvement: true          # baseline; see market3_no_improvement.yaml
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0             # whole period, like market 5's photocopied log
  period_end_notes: 2
  trade_notes: 3
  not_selected_window: 5
agents:
  - kind: llm
    model: deepseek-v4-flash
    base_url: $DASHSCOPE_BASE_URL      # Bailian; same weights, ~half the price
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.7
    thinking: true                 # turn decisions reason
    broadcast_thinking: true       # measured: with thinking off, 67% of broadcast
                                   # replies cited the wrong expected value (50/50
                                   # instead of the bingo cage's 16/40), and every
                                   # belief-action contradiction came through that
                                   # channel. See scenarios/market3_broadcast_fast.yaml
    # Reasoning and the JSON share this budget. At 2048, 38% of turn calls hit it
    # and 12% came back truncated mid-string -> unparseable -> forced no_quote,
    # i.e. an agent that meant to trade recorded as passing. Measured reasoning
    # median 1,716 and max 6,144, so 2048 sat well inside the distribution.
    max_output_tokens: 8192
    # 8192, not 512, and the number is measured. `broadcast_max_output_tokens` was dead
    # config until f27fec7/f789d04: every broadcast in every earlier run used the provider
    # default of 8192, which is what market 3's completed sessions ran at. The first run
    # after the cap actually reached the provider truncated 29% of broadcasts (249 of 859)
    # to an empty string -- the model spent the whole 512 reasoning and emitted no JSON,
    # measured as reasoning_tokens 1,536 = 3 x 512 across the call and its two repairs.
    # The unconstrained distribution from those market-3 runs: median 609, 58% over 512,
    # p95 2,526, p99 3,756, max 7,170. A cap here does not save money either: a truncated
    # call burns 1,536 tokens and returns nothing, against 609 for one clean call.
    broadcast_max_output_tokens: 8192
    reflect_thinking: true          # notes reason too; see docs/design-deltas.md 5.2
    # Reasoning shares this budget. At 400 (and even at 1200) the note itself was
    # truncated away: 6 of 12 year-end notes came back empty on the probe run.
    reflect_max_output_tokens: 3000

pricing:
  input_per_mtok: 0.1408
  cached_input_per_mtok: 0.0282
  output_per_mtok: 0.2817
