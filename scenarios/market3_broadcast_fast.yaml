# Cost arm: broadcast responses run with thinking OFF.
#
# Design doc §13.2 proposes this as the one place worth downgrading, since broadcast
# replies are ~70% of all calls. The smoke run measured what it costs:
#
#   thinking OFF (broadcast)  — of 69 replies stating an expected value, 46 (67%) stated
#                               the WRONG one. Type I said 250 and type II said 225, i.e.
#                               (400+100)/2 and (300+150)/2 — a 50/50 prior rather than
#                               the bingo cage's 16/40. All 6 belief-action contradictions
#                               in the run came through this channel.
#   thinking ON  (own turn)   — 22 of 24 reservation prices exactly on the true prior EV;
#                               0 contradictions.
#
# Most trades are struck through the broadcast channel, so this arm risks measuring the
# model's arithmetic rather than whether the market aggregates information. It is kept
# because the comparison is the evidence, and because it roughly halves cost and runtime.
run_name: market3_broadcast_fast
seed: 20250725
sequence_preset: paper_exact
sessions: 1
max_rounds_per_period: 3

rules:
  price_improvement: true          # baseline; see market3_no_improvement.yaml
  announce_no_info_period: false   # faithful: market 3's subjects were not told
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0             # whole period, like market 5's photocopied log
  period_end_notes: 2
  trade_notes: 3
  not_selected_window: 5
agents:
  - kind: llm
    model: deepseek-v4-flash
    temperature: 0.7
    thinking: true                 # turn decisions reason
    broadcast_thinking: false      # the downgraded arm — see the header
    # Reasoning and the JSON share this budget. At 2048, 38% of turn calls hit it
    # and 12% came back truncated mid-string -> unparseable -> forced no_quote,
    # i.e. an agent that meant to trade recorded as passing. Measured reasoning
    # median 1,716 and max 6,144, so 2048 sat well inside the distribution.
    max_output_tokens: 8192
    broadcast_max_output_tokens: 512
    reflect_thinking: true          # notes reason too; see docs/design-deltas.md 5.2
    # Reasoning shares this budget. At 400 (and even at 1200) the note itself was
    # truncated away: 6 of 12 year-end notes came back empty on the probe run.
    reflect_max_output_tokens: 3000

pricing:
  input_per_mtok: 0.28
  cached_input_per_mtok: 0.028
  output_per_mtok: 0.42
