# The equidistant control on a second vendor: gemini-3.5-flash via Vertex, thinking OFF,
# the first five periods of the seed-42 draw.
#
# `periods: 5` truncates rather than describing a different market, so this run is a
# literal PREFIX of m6_ctrl_42 — same market 6, same draw, same round order, same
# seat->name map. Period for period the only difference is the model, which is how
# m3_gem_paper pairs with m3_paper_0.
#
#   p1  X  none                                     the prior alone: does it price 220?
#   p2  Y  none
#   p3  X  insider   re 300  +80  NON-separating    the informed want to BUY
#   p4  Y  insider   re 140  -80  separating        the informed want to SELL
#   p5  X  insider   re 300  +80                    buy again
#
# Both sides appear, at equal distance, inside five periods. That is what makes this worth
# running before the three full sessions rather than after: if the buy side sits at 220 and
# the sell side at 140 here, the control is measuring what it was built to measure.
run_name: m6_gem_quick
seed: 42
sequence_preset: random_prior
market: 6
sessions: 1
periods: 5
max_rounds_per_period: 3
# Vertex serves gemini-3.5-flash from a DYNAMIC SHARED QUOTA: there is no per-project limit
# to raise, so a 429 means the shared pool is saturated and the only lever is to ask for
# less. W=12 produced 54 retries in 75 calls, exhausted the retry budget 9 times and turned
# 5 turns into violations — an agent skipping a turn because of an API failure is corrupted
# data, not a decision. W=2, slow pace, deep retry budget.
broadcast_workers: 2

rules:
  price_improvement: true
  announce_no_info_period: false   # market 3's design, which market 6 inherits
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0
  period_end_notes: 2
  trade_notes: 3
  not_selected_window: 5
agents:
  - kind: llm
    model: gemini-3.5-flash        # the model name alone selects the Vertex provider
    temperature: 0.7
    # Measured on this model: thinking_level="minimal" reports no thoughts_token_count at
    # all (404 tokens and 3.5s when unset), so it really is off — unlike Gemini 3.0.
    thinking: false
    broadcast_thinking: false
    reflect_thinking: false
    max_output_tokens: 8192
    broadcast_max_output_tokens: 512
    reflect_max_output_tokens: 3000
    # Shared-quota 429s are not a burst that clears in seconds; the pool stays saturated.
    # A 5-retry budget (<=62s) was exhausted 9 times in 75 calls.
    max_retries: 8
    pace: 1.0

# Vertex AI, Gemini 3.5 Flash, Standard tier, GLOBAL location. Reasoning tokens bill as
# output. Implicit caching needs 4,096 input tokens on Gemini 3.x and a turn prompt here is
# ~2,300, so every call bills at the full input rate — this arm is ~7x DeepSeek per session.
pricing:
  input_per_mtok: 1.50
  cached_input_per_mtok: 0.15
  output_per_mtok: 9.00
