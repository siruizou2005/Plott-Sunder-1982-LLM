# Market 7, the ladder's DECOMPOSITION session. Tier 1's disclosure, plus the two
# prompt dials and the memo that ride with tiers 2 and 3 -- and NOT disclose_card_years.
#
# It exists because tier 2 minus tier 1 moves four things at once. This session holds the
# card-year announcement out and moves the other three, so the pair
#
#     runs/disclosed/m7_disc_42   (tier 1: structure only, note style)
#     ladder1b/m7_lad1b_42        (tier 1 + objective + certainty + memo)
#
# isolates the three passengers, and
#
#     ladder1b/m7_lad1b_42        (this session)
#     ladder2/m7_lad2_42          (adds disclose_card_years, nothing else)
#
# then isolates the card-year rung itself. Together with tier3 - tier2 for the fixedness
# sentence, every step of the ladder becomes a single-dial contrast.
#
# What moves against tier 1: objective_profit_max puts an earnings objective in the turn,
# broadcast AND reflection prompts (the baseline states one only on a turn);
# clue_is_certain strengthens wording that already said a lettered card is always correct;
# period_end_style: memo replaces the fourteen disconnected ~105-word notes with one
# standing document the agent rewrites each year. None of the three states a new fact
# about the market's structure -- which is exactly why they are worth separating from the
# rung that does.
#
# Run on m7_ctrl_42's seed, so this session draws the same fourteen states as its
# baseline, its tier-1 pair and both ladder rungs, and every comparison is paired period
# by period.
run_name: ladder1b/m7_lad1b_42
seed: 42
sequence_preset: random_prior
market: 7
sessions: 1
max_rounds_per_period: 3
# Two sessions x 12 workers = 24 in flight at the ceiling; run together with the other
# ladder waves, ten sessions and a ceiling of 120, at zero retries.
broadcast_workers: 12

rules:
  price_improvement: true          # baseline; see market3_no_improvement.yaml
  elicit_beliefs: true
  broadcast_reason: true
  market_log_window: 0             # whole period, like market 5's photocopied log
  trade_notes: 3
  not_selected_window: 5
  # What this session sets. pydantic drops unknown keys silently, so a typo here would
  # run a different rung under this run_name -- tests/test_scenarios.py asserts every
  # flag loads AND that disclose_card_years is still off, which is the whole point.
  disclose_structure: true         # tier 1, unchanged -- and the ONLY disclosure
  objective_profit_max: true       # rides with tiers 2 and 3; see above
  clue_is_certain: true            # rides with tiers 2 and 3; states no new fact
  # disclose_card_years is deliberately OFF: that is the rung this session exists to
  # hold constant. announce_no_info_period stays unset, exactly as in the paired
  # tier-1 session, so no year's card condition is announced at all.
  #
  # The year-end summary runs as a MEMO rather than a fresh 100-word note: one standing
  # document, rewritten in full each year, the new version replacing the old. The baseline
  # note is honoured tightly (median 105 words), so fourteen years leave fourteen
  # disconnected notes behind a window of two and nothing carries a view forward. Config
  # forces the window to 1 -- a memo already contains its own history -- and refuses any
  # reflect budget that could not hold a memo at the stated ceiling with reasoning's worst
  # measured run alongside it, which is why the agent block below raises it.
  #
  # This is held CONSTANT across tiers 2 and 3, so tier3 - tier2 is still the single-dial
  # fixedness contrast. It does mean tier2 - tier1 moves four things at once against the
  # completed runs/disclosed/ sessions, not three; docs/disclosure-treatment.md says so.
  period_end_style: memo
  period_end_notes: 1              # forced by Config: the memo supersedes its own history
agents:
  - kind: llm
    model: deepseek-v4-flash
    base_url: $DASHSCOPE_BASE_URL      # Bailian; same weights, ~half the price
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.7
    thinking: true                 # turn decisions reason
    broadcast_thinking: true       # measured: with thinking off, 67% of broadcast
                                   # replies cited the wrong expected value; see
                                   # scenarios/market3_broadcast_fast.yaml
    max_output_tokens: 8192        # reasoning and the JSON share this budget; at 2048,
                                   # 12% of turn calls truncated mid-string
    broadcast_max_output_tokens: 8192  # 512 truncated 29% of broadcasts to nothing;
                                       # see scenarios/m7_control_r6_s42.yaml
    reflect_thinking: true          # notes reason too; see docs/design-deltas.md 5.2
    reflect_max_output_tokens: 16384 # measured on runs/probes/ladder2_smoke: the body
                                    # runs 1.25 tokens/word and reasoning, which shares
                                    # this budget, ran a median of 1,800 and a max of
                                    # 7,450. A memo at the 1200-word ceiling is ~1,500
                                    # tokens, so the floor Config enforces is 9,000; this
                                    # clears it with room, because a truncated memo is
                                    # non-empty and is therefore STORED as the seat's
                                    # whole memory
    reflect_empty_retries: 3        # an empty note used to be discarded outright -- no
                                    # retry loop covered it, and under the memo style
                                    # losing one year silently reverts that agent to the
                                    # previous year's view. Usage is summed across
                                    # attempts, so a retry is billed for what it cost

pricing:
  input_per_mtok: 0.1408
  cached_input_per_mtok: 0.0282
  output_per_mtok: 0.2817
